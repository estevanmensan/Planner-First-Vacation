<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner Dezembro 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="band">
  <header><h1>December</h1><div class="year">2026</div></header>

  <form class="auth" id="loginForm" hidden>
    <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button class="btn" type="submit" id="entrar">Entrar</button>
    <p class="msg" id="loginMsg">Entre para ver e adicionar as fotos de cada dia.</p>
  </form>
  <div class="auth in" id="userBar" hidden>
    <span id="userTxt"></span>
    <button class="btn ghost" id="sair" type="button" style="margin-left:auto">Sair</button>
  </div>

  <p class="status" id="status"><span class="dot"></span><span id="statusTxt">Carregando…</span></p>
  <div class="cal" id="cal" aria-label="Calendário de dezembro de 2026"></div>
  <p class="note">Toque em qualquer dia para ver a programação e guardar as fotos daquele dia.</p>
</main>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="mhead">
    <div><h2 id="dTitle"></h2><p id="dSub"></p></div>
    <button class="x" id="close" aria-label="Fechar">×</button>
  </div>
  <div class="mbody">
    <ul class="agenda" id="agenda"></ul>
    <div class="drop" id="drop">
      <button class="btn" id="pick" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Adicionar fotos</button>
      <p id="dropHint">ou arraste as imagens para cá</p>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <div id="confirmBox"></div>
    <div class="gal" id="gal"></div>
  </div>
</dialog>

<dialog id="lb" aria-label="Foto ampliada">
  <img id="lbImg" alt="">
  <div class="bar">
    <button class="btn" id="lbPrev" aria-label="Foto anterior">‹</button>
    <button class="btn ghost" id="lbClose">Fechar</button>
    <button class="btn" id="lbNext" aria-label="Próxima foto">›</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
